services:
  # Backend: Python Service
  - type: web
    name: srt-converter-backend
    env: docker
    rootDir: python-service
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_SERVICE_PORT
        value: 5000
      - key: ANTHROPIC_API_KEY
        sync: false  # User will be prompted to enter this
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: srt-converter-client
          property: url

  # Frontend: Node Web Service (Serving Client + Proxy)
  - type: web
    name: srt-converter-client
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: srt-converter-backend
          property: url
