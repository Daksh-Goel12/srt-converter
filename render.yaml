services:
  # Backend: Python Service
  - type: web
    name: srt-converter-backend
    env: docker
    rootDir: python-service
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_SERVICE_PORT
        value: 5000
      - key: ANTHROPIC_API_KEY
        sync: false  # User will be prompted to enter this

  # Frontend: Node Web Service (Serving Client + Proxy)
  - type: web
    name: srt-converter-client
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PYTHON_SERVICE_URL
        sync: false # User must enter the Public URL of the Backend Service (e.g. https://backend.onrender.com)
