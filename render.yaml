services:
  # Backend: Python Service
  # Backend is now hosted on Hugging Face Spaces to effectively use 16GB free RAM.
  # We only deploy the frontend on Render.

  # Frontend: Node Web Service (Serving Client + Proxy)
  - type: web
    name: srt-converter-client
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PYTHON_SERVICE_URL
        sync: false # User must enter the Public URL of the Backend Service (e.g. https://backend.onrender.com)
